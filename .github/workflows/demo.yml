name: Manual demo report

# No daily schedule until the real data source and durable storage are ready.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-report
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m threads_bot --source demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report-${{ github.run_id }}
          path: |
            reports/demo/
            data/demo.sqlite3
          if-no-files-found: error
          retention-days: 7
