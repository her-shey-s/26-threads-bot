name: Threads publish

# Manual only. Enable the schedule after a successful live run (README "D. 검증 순서").
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run makes no API calls; live posts to Threads
        type: choice
        options: [dry-run, live]
        default: dry-run
  # schedule:
  #   - cron: '7 0,4,11 * * *'  # UTC; 09:07, 13:07, 20:07 KST. Actions may start late.

permissions:
  contents: write  # live runs commit content/history.jsonl

concurrency:
  group: threads-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode || vars.THREADS_SCHEDULED_MODE || 'dry-run' }}
      THREADS_PUBLISH_PAUSED: ${{ vars.THREADS_PUBLISH_PAUSED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m threads_bot.publish_cli check --mode "$MODE"
      - name: Publish one due draft
        env:
          THREADS_USER_ID: ${{ env.MODE == 'live' && secrets.THREADS_USER_ID || '' }}
          THREADS_ACCESS_TOKEN: ${{ env.MODE == 'live' && secrets.THREADS_ACCESS_TOKEN || '' }}
        run: python -m threads_bot.publish_cli run --mode "$MODE"
      - name: Commit publish history
        if: always() && env.MODE == 'live'
        run: |
          git add content/history.jsonl 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record Threads publish history"
          git push
