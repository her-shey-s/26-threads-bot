name: Threads publish

# Scheduled runs wake every 30 minutes between 09:13 and 21:43 KST. The Python code
# picks 3 random slots per day (09:00-21:30 KST, at least 2 hours apart) and posts
# only when a slot has passed. Scheduled runs post for real only when the repository
# variable THREADS_SCHEDULED_MODE is "live"; otherwise they dry-run.
on:
  schedule:
    - cron: '13,43 0-12 * * *'  # UTC = 09:13-21:43 KST. GitHub may start runs late.
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run makes no API calls; live posts to Threads (manual runs ignore slots)
        type: choice
        options: [dry-run, live]
        default: dry-run

permissions:
  contents: write  # live runs commit content/history.jsonl

concurrency:
  group: threads-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode || vars.THREADS_SCHEDULED_MODE || 'dry-run' }}
      SLOTS: ${{ github.event_name == 'schedule' && '3' || '0' }}
      THREADS_PUBLISH_PAUSED: ${{ vars.THREADS_PUBLISH_PAUSED }}
      THREADS_SCHEDULE_SEED: ${{ secrets.THREADS_SCHEDULE_SEED }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}  # latest branch head, so history committed by a previous run is seen
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m threads_bot.publish_cli check --mode "$MODE" --daily-slots "$SLOTS"
      - name: Publish one due draft
        env:
          THREADS_USER_ID: ${{ env.MODE == 'live' && secrets.THREADS_USER_ID || '' }}
          THREADS_ACCESS_TOKEN: ${{ env.MODE == 'live' && secrets.THREADS_ACCESS_TOKEN || '' }}
        run: python -m threads_bot.publish_cli run --mode "$MODE" --daily-slots "$SLOTS"
      - name: Commit publish history
        if: always() && env.MODE == 'live'
        run: |
          git add content/history.jsonl 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record Threads publish history"
          for attempt in 1 2 3 4; do
            git push && exit 0
            sleep $((attempt * 5))
            git pull --rebase
          done
          echo "::error::Could not push publish history; the next run may repost. Check content/history.jsonl."
          exit 1
